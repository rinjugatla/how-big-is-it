<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サイズ体感ビューア</title>
<meta name="description" content="縦・横・高さを入力して、日常にあるものと並べて大きさを3Dで体感できます。">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="title-row">
      <h1>📦 サイズ体感ビューア</h1>
      <button id="collapse" type="button" class="icon-btn" aria-label="サイドバーをたたむ" title="サイドバーをたたむ">«</button>
    </div>
    <p class="lead">寸法を入れると3Dの箱が現れ、身近なものと並べて大きさを確かめられます。</p>

    <section class="inputs">
      <div id="boxes"></div>
      <button id="add-box" type="button" class="add">＋ 箱を追加</button>
      <p id="error" class="error" hidden></p>
    </section>

    <section class="rotbar viewbar">
      <label class="sw"><span>寸法を表示</span><input id="dims" type="checkbox" role="switch" checked><i></i></label>
      <label class="sw"><span>自動で回す</span><input id="rotate" type="checkbox" role="switch"><i></i></label>
      <label class="sw"><span>近いものを自動選択</span><input id="auto" type="checkbox" role="switch" checked><i></i></label>
      <div class="rot-btns">
        <button id="fit" type="button">全体を表示</button>
        <button id="reset" type="button">配置をリセット</button>
        <button id="share" type="button">🔗 共有URLをコピー</button>
      </div>
    </section>

    <section class="rotbar">
      <div class="rot-title">選択中: <b id="active-name">-</b><span class="rot-note">（3D上でクリックして選択）</span></div>
      <div class="rot-btns">
        <button type="button" data-rot="yaw">↻ 水平に90°</button>
        <button type="button" data-rot="pitch">⤵ 前後に90°倒す</button>
        <button type="button" data-rot="roll">⤴ 左右に90°倒す</button>
        <button type="button" data-rot="reset">元に戻す</button>
      </div>
    </section>

    <section id="summary" class="summary"></section>

    <section>
      <div class="list-head">
        <h2>比べるもの</h2>
      </div>
      <div id="chips"></div>
    </section>

    <p class="hint">右ドラッグ: 回転 ／ ホイール(中ボタン)ドラッグ・2本指: 移動 ／ ホイール回転・ピンチ: 拡大縮小 ／ 左ドラッグ: 物を床の上で動かす</p>
  </aside>

  <main class="stage" id="stage">
    <button id="expand" type="button" class="icon-btn expand" aria-label="サイドバーを開く" title="サイドバーを開く" hidden>☰</button>
    <div class="grid-note" id="grid-note"></div>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
